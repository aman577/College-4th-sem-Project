<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parlor Signup</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to bottom right, #ffe4e1, #ff91a4);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #444;
    }

    .form-container {
      width: 400px;
      padding: 30px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      font-size: 2rem;
      color: #ff4081;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: 0.3s;
      box-sizing: border-box;
    }

    input:focus {
      border-color: #ff4081;
      outline: none;
      box-shadow: 0 0 5px rgba(255, 64, 129, 0.5);
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      background: #ff4081;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #e03072;
    }

    .error-message {
      font-size: 0.9rem;
      color: red;
      margin-bottom: 10px;
      text-align: left;
    }

    .switch-link {
      margin-top: 15px;
    }

    .switch-link a {
      text-decoration: none;
      font-weight: bold;
      color: #ff4081;
    }

    .switch-link a:hover {
      text-decoration: underline;
    }

    .form-container::before {
      content: "";
      display: block;
      height: 5px;
      width: 100px;
      margin: 0 auto 20px;
      background: #ff4081;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Signup</h2>
    <form id="signup-form" action="db.php" method="POST">
      <label for="first-name">First Name</label>
      <input type="text" id="first-name" name="firstname" placeholder="Enter your first name" required>
      <div id="first-name-error" class="error-message"></div>

      <label for="last-name">Last Name</label>
      <input type="text" id="last-name" name="lastname" placeholder="Enter your last name" required>
      <div id="last-name-error" class="error-message"></div>

      <label for="signup-email">Email</label>
      <input type="email" id="signup-email" name="email" placeholder="Enter your email" required>
      <div id="signup-email-error" class="error-message"></div>

      <label for="signup-password">Password</label>
      <input type="password" id="signup-password" name="password" placeholder="Enter your password" required>
      <div id="signup-password-error" class="error-message"></div>

      <label for="confirm-password">Confirm Password</label>
      <input type="password" id="confirm-password" name="confirmpassword" placeholder="Re-enter your password" required>
      <div id="confirm-password-error" class="error-message"></div>

      <button type="submit" name="signUp">Sign Up</button>
    </form>

    <div class="switch-link">
      Already have an account? <a href="mainlogin.php">Login</a>
    </div>
  </div>

  <script>
    // Regex patterns
    const namePattern = /^[A-Za-z]+$/;
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*(),.?":{}|<>])[A-Za-z\d!@#$%^&*(),.?":{}|<>]{8,}$/;

    // First Name Validation
    const firstName = document.getElementById("first-name");
    const firstNameError = document.getElementById("first-name-error");

    firstName.addEventListener("input", () => {
      if (namePattern.test(firstName.value)) {
        firstNameError.textContent = "";
      } else {
        firstNameError.textContent = "First name must only contain letters.";
      }
    });

    // Last Name Validation
    const lastName = document.getElementById("last-name");
    const lastNameError = document.getElementById("last-name-error");

    lastName.addEventListener("input", () => {
      if (namePattern.test(lastName.value)) {
        lastNameError.textContent = "";
      } else {
        lastNameError.textContent = "Last name must only contain letters.";
      }
    });

    // Email Validation
    const email = document.getElementById("signup-email");
    const emailError = document.getElementById("signup-email-error");

    email.addEventListener("input", () => {
      if (emailPattern.test(email.value)) {
        emailError.textContent = "";
      } else {
        emailError.textContent = "Please enter a valid email address.";
      }
    });

    // Password Validation
    const password = document.getElementById("signup-password");
    const passwordError = document.getElementById("signup-password-error");

    password.addEventListener("input", () => {
      if (passwordPattern.test(password.value)) {
        passwordError.textContent = "";
      } else {
        passwordError.textContent = "Password must have at least 8 characters, including uppercase, lowercase, numbers, and special characters.";
      }
    });

    // Confirm Password Validation
    const confirmPassword = document.getElementById("confirm-password");
    const confirmPasswordError = document.getElementById("confirm-password-error");

    confirmPassword.addEventListener("input", () => {
      if (confirmPassword.value === password.value) {
        confirmPasswordError.textContent = "";
      } else {
        confirmPasswordError.textContent = "Passwords do not match.";
      }
    });
  </script>
</body>
</html>
