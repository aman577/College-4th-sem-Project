<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;700&family=Dancing+Script&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jost', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f5f2;
            color: #333;
        }
        .error-message {
        color: red;
        font-size: 0.9rem;
        margin-top: -10px;
        margin-bottom: 10px;
        display: block;
    }

        header {
            background-color: #4c3a51;
            padding: 20px;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            list-style: none;
            background-color: #4c3a51;
            padding: 10px 0;
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 1rem;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        nav a:hover {
            background-color: #6d4c71;
        }

        .appointment-section {
            background-color: #ffffff;
            padding: 30px;
            margin: 30px auto;
            max-width: 700px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .appointment-section h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: #4c3a51;
            text-align: center;
            margin-bottom: 20px;
        }

        .appointment-form {
            display: flex;
            flex-direction: column;
        }

        .appointment-form label {
            font-size: 1rem;
            margin-bottom: 8px;
            color: #555;
        }

        .appointment-form input,
        .appointment-form select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .appointment-form button {
            background-color: #4c3a51;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .appointment-form button:hover {
            background-color: #6d4c71;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <li><a href="hellomain.htm">HOME</a></li>
            <li><a href="menu.htm">MENU</a></li>
            <li><a href="Services.htm">OUR SERVICES</a></li>
            <li><a href="about.htm">ABOUT US</a></li>
            <li><a href="#active">CONTACT US</a></li>
        </nav>
    </header>

    <!-- Appointment Booking Section -->
    <div class="appointment-section" id="appointment">
        <h2>Book an Appointment</h2>
        <form action="appointment.php" method="POST" class="appointment-form" id="appointmentForm">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" oninput="validateName()">
            <span id="nameError" class="error-message"></span>
        
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" oninput="validateEmail()">
            <span id="emailError" class="error-message"></span>
        
            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" oninput="validatePhone()">
            <span id="phoneError" class="error-message"></span>
        
            <label for="service">Select Service:</label>
            <select id="service" name="service" required>
                <option value="facial">Facial</option>
                <option value="eyelash">Eyelash</option>
                <option value="eyebrow">Eyebrow</option>
                <option value="waxing">Waxing</option>
                <option value="nails">Nails</option>
                <option value="makeup">Make-up</option>
            </select>
        
            <label for="date">Preferred Date:</label>
            <input type="date" id="date" name="date" min="2025-01-04" onchange="validateDate()">
            <span id="dateError" class="error-message"></span>
        
            <label for="time">Preferred Time:</label>
            <input type="time" id="time" name="time" required>
        
            <button type="submit">Submit</button>
        </form>
        
    </div>
    <script>
        // Real-time validation functions
    
        function validateName() {
            const nameField = document.getElementById("name");
            const nameError = document.getElementById("nameError");
            const name = nameField.value.trim();
    
            if (!/^[A-Za-z\s]+$/.test(name)) {
                nameError.textContent = "Name can only contain letters and spaces.";
                nameField.style.borderColor = "red";
            } else {
                nameError.textContent = "";
                nameField.style.borderColor = "green";
            }
        }
    
        function validateEmail() {
            const emailField = document.getElementById("email");
            const emailError = document.getElementById("emailError");
            const email = emailField.value.trim();
    
            if (!/^\S+@\S+\.\S+$/.test(email)) {
                emailError.textContent = "Please enter a valid email address.";
                emailField.style.borderColor = "red";
            } else {
                emailError.textContent = "";
                emailField.style.borderColor = "green";
            }
        }
    
        function validatePhone() {
            const phoneField = document.getElementById("phone");
            const phoneError = document.getElementById("phoneError");
            const phone = phoneField.value.trim();
    
            if (!/^(98|97|96)\d{8}$/.test(phone)) {
                phoneError.textContent = "Enter 10 digit numbers(starts with 98, 97, or 96).";
                phoneField.style.borderColor = "red";
            } else {
                phoneError.textContent = "";
                phoneField.style.borderColor = "green";
            }
        }
    
        function validateDate() {
            const dateField = document.getElementById("date");
            const dateError = document.getElementById("dateError");
            const date = dateField.value;
            const today = new Date().toISOString().split("T")[0];
    
            if (date < today) {
                dateError.textContent = "Date cannot be in the past.";
                dateField.style.borderColor = "red";
            } else {
                dateError.textContent = "";
                dateField.style.borderColor = "green";
            }
        }
    
        // Add event listeners for other fields if needed
    </script>
    
    
</body>

</html>
